<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · webthinking</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var d = document.documentElement;
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark" || saved === "system") d.dataset.theme = saved;
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    .lost { display: grid; place-content: center; min-height: 100svh; padding: 24px; text-align: center; }
    .lost h1 { font-size: clamp(3rem, 12vw, 6rem); }
    .lost p { margin: 12px 0 28px; color: var(--muted); }
    .lost .go { justify-self: center; }
  </style>
</head>
<body>
  <main class="lost">
    <h1>404</h1>
    <p>That page isn’t here.</p>
    <a class="go" href="/">Back to the tools <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
