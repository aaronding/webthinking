# Checks every push, and uploads a version with its own preview URL for any branch but main.
# The live site is only deployed by the Release workflow (release.yml).
#
# It needs two repository secrets: CLOUDFLARE_API_TOKEN, a token made from Cloudflare's
# "Edit Cloudflare Workers" template, and CLOUDFLARE_ACCOUNT_ID.
name: Preview
run-name: Preview ${{ github.ref_name }}

on:
  push:

# One run per branch. A newer push to a branch replaces its running preview.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  check:
    name: Check the site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --check worker.js
      - run: node scripts/check.mjs

  preview:
    name: Preview this branch
    needs: check
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Upload a version with a preview URL
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # A DNS-safe alias from the branch name, short enough for the Worker's name to follow it.
          alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//' | cut -c1-40 | sed 's/-$//')
          out=$(npx wrangler@4 versions upload --preview-alias "$alias" --message "${SHA:0:7} on $BRANCH")
          echo "$out"
          url=$(printf '%s\n' "$out" | sed -n 's/^Version Preview Alias URL: //p')
          [ -n "$url" ] || { echo '::error::wrangler printed no preview URL'; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview for \`$BRANCH\`: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Say so on the pull request, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "Preview: $URL"
          fi
